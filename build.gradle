plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://maven.maxhenkel.de/repository/public" }
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rubymod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Simple Voice Chat API (optional at runtime: the Field Radio uses it when the mod is installed).
	compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.24"
	// Run the dev client and test server with Simple Voice Chat, to exercise the Field Radio plugin.
	localRuntime "maven.modrinth:simple-voice-chat:fabric-2.6.24+26.3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Build ID: a fingerprint of the code and data (line endings ignored, so a Windows build and the server's
// Linux build of the same commit match). The server tells players whose mod doesn't match to update.
def buildIdDir = layout.buildDirectory.dir("generated/buildid")
def buildIdSources = fileTree("src") { include "**/*.java", "**/*.json" }
def buildIdRoot = projectDir
def buildIdTask = tasks.register("buildId") {
	inputs.files(buildIdSources).withPathSensitivity(PathSensitivity.RELATIVE)
	outputs.dir(buildIdDir)
	doLast {
		def digest = java.security.MessageDigest.getInstance("SHA-256")
		def root = buildIdRoot.toPath()
		def files = buildIdSources.files.collect { [root.relativize(it.toPath()).toString().replace('\\', '/'), it] }.sort { it[0] }
		for (pair in files) {
			digest.update((pair[0] as String).getBytes("UTF-8"))
			byte[] bytes = (pair[1] as File).bytes
			def text = new ByteArrayOutputStream(bytes.length)
			for (byte b : bytes) {
				if (b != 13) {
					text.write(b)
				}
			}
			digest.update(text.toByteArray())
		}
		def out = buildIdDir.get().file("rubymod_build.txt").asFile
		out.parentFile.mkdirs()
		out.text = digest.digest().encodeHex().toString().substring(0, 12)
	}
}
sourceSets.main.resources.srcDir(buildIdTask)

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
